<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="/wp-content/themes/dept/public/favicon.png">
  <title>DEPT® Brand Library</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: Inter Variable, system-ui;
    font-style: normal;
    font-display: swap;
      background-color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    font-weight: 100 900;
    src: url(/wp-content/themes/dept/public/4f2981d….woff2) format("woff2-variations");
    unicode-range: U + ??, U +131, U +152 -153, U +2BB -2BC, U +2C6, U +2DA, U +2DC, U +304, U +308, U +329, U +2000 -206F, U +20AC, U +2122, U +2191, U +2193, U +2212, U +2215, U + FEFF, U + FFFD;
}
      
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent; 
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }

    /* Modal Animation Utilities */
    .fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .zoom-in { animation: zoomIn 0.2s ease-out forwards; }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="text-slate-800 flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
  
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center shadow-sm">
            <img src="https://www.dept.global/wp-content/uploads/2025/10/logo-dept.svg" alt="Dept logo image">
          </div>
          

        
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <!-- Page Title & Filters -->
    <div class="mb-8 space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
        <div>
          <span class="text-xl font-bold tracking-tight text-slate-900">  BRAND LIBRARY</span>
          <p class="text-slate-500 mt-1">Browse, search, and access brand assets.</p>
        </div>
      </div>

      <!-- Search and Filter Bar -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col lg:flex-row gap-4 items-center">
        <div class="relative flex-1 w-full">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
          </div>
          <input 
            type="text" 
            id="searchInput"
            class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all" 
            placeholder="Search by title or metadata tags..." 
          />
        </div>

        <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
          <div class="w-full sm:w-48 relative">
            <select 
              id="typeSelect"
              class="block w-full pl-3 pr-10 py-2.5 text-base border-slate-200 border bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-xl appearance-none cursor-pointer">
              <option value="">All Types</option>
              <option value="Video">Video</option>
              <option value="Images">Images</option>
              <option value="Gifs">Gifs</option>
              <option value="Logos">Logos</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </div>

          <div class="w-full sm:w-48 relative">
            <select 
              id="contentSelect"
              class="block w-full pl-3 pr-10 py-2.5 text-base border-slate-200 border bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-xl appearance-none cursor-pointer">
              <option value="">All Content</option>
              <option value="Showreel">Showreel</option>
              <option value="Client Case">Client Case</option>
              <option value="Brand">Brand</option>
              <option value="Culture">Culture</option>
              <option value="Events">Events</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </div>
        </div>
      </div>
      
      <div class="text-sm text-slate-500 flex items-center gap-2">
         Showing 
         <span id="assetCount" class="font-semibold text-slate-800 bg-slate-200 px-2 py-0.5 rounded-full">0</span> 
         <span id="assetWord">assets</span>
         
         <button id="clearFiltersBtn" class="ml-2 text-indigo-600 hover:text-indigo-800 underline transition-colors focus:outline-none hidden">Clear filters</button>
      </div>
    </div>

    <!-- Empty State (Hidden by default) -->
    <div id="emptyState" class="hidden text-center py-20 bg-white rounded-3xl border border-slate-200 border-dashed shadow-sm">
      <svg class="mx-auto h-16 w-16 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
      </svg>
      <h3 class="mt-4 text-lg font-medium text-slate-900">No assets found</h3>
      <p class="mt-2 text-slate-500 max-w-md mx-auto">We couldn't find anything matching your current filters. Try adjusting your search term or category selections.</p>
      <button onclick="clearAllFilters()" class="mt-6 inline-flex items-center px-5 py-2.5 border border-transparent text-sm font-medium rounded-xl shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Clear all filters
      </button>
    </div>

    <!-- Asset Grid -->
    <div id="assetGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Generated by JavaScript -->
    </div>
  </main>

  <!-- Asset Preview Modal (Hidden by default) -->
  <div id="previewModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 hidden" aria-modal="true" role="dialog">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closePreview()"></div>
    
    <!-- Modal Panel -->
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col md:flex-row overflow-hidden fade-in zoom-in">
      
      <!-- Close Button -->
      <button onclick="closePreview()" class="absolute top-4 right-4 z-20 p-2 bg-black/20 hover:bg-black/40 text-white rounded-full backdrop-blur-md transition-colors focus:outline-none">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>

      <!-- Media Area -->
      <div id="modalMediaContainer" class="w-full md:w-3/5 bg-slate-900 flex items-center justify-center relative min-h-[300px] md:min-h-0">
        <!-- Injected via JS -->
      </div>

      <!-- Info Area -->
      <div class="w-full md:w-2/5 flex flex-col h-full bg-white max-h-[50vh] md:max-h-[90vh] overflow-y-auto">
        <div class="p-6 sm:p-8 flex-1 flex flex-col">
          <div class="flex flex-wrap gap-2 mb-4">
            <span id="modalType" class="inline-flex items-center px-2.5 py-0.5 rounded-md text-[11px] font-semibold tracking-wide uppercase bg-indigo-50 text-indigo-700"></span>
            <span id="modalContent" class="inline-flex items-center px-2.5 py-0.5 rounded-md text-[11px] font-semibold tracking-wide uppercase bg-teal-50 text-teal-700"></span>
          </div>
          
          <h2 id="modalTitle" class="text-2xl font-bold text-slate-900 mb-2"></h2>
          
          <div class="flex items-center gap-4 text-sm text-slate-500 mb-6 pb-6 border-b border-slate-100">
            <div class="flex items-center gap-1.5">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
              <span id="modalDate"></span>
            </div>
            <div id="modalDurationContainer" class="flex items-center gap-1.5 hidden">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              <span id="modalDuration"></span>
            </div>
          </div>

          <div class="text-slate-600 mb-8 flex-1 text-sm">
            <h3 class="font-semibold text-slate-900 uppercase tracking-wider mb-2 text-xs">Description</h3>
            <p id="modalDescription" class="leading-relaxed"></p>
          </div>

          <div class="mt-auto pt-4">
            <!-- Google Drive Placeholder Button -->
            <button class="w-full flex items-center justify-center gap-2 bg-[#4285F4] hover:bg-[#3367d6] text-white font-medium py-3 px-4 rounded-xl transition-all duration-200 shadow-sm shadow-blue-500/30">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7.71 3.5L1.15 15l3.43 6 6.55-11.5M9.73 15L6.3 21h13.12l3.43-6M13.4 3.5l-3.44 6L16.5 21h6.86" />
              </svg>
              View on Google Drive
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Mock Data ---
    const mockAssets = [
      {
        id: '1',
        title: 'DEPT® Agent Studio',
        type: 'Video',
        content: 'Showreel',
        thumbnailUrl: 'http://img.youtube.com/vi/JHH1wDCUbd0/maxresdefault.jpg',
        mediaUrl: '<iframe width="560" height="315" src="https://www.youtube.com/embed/JHH1wDCUbd0?si=0ZRO_7ewOjfS0DD8" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',
        description: 'High-energy showreel highlighting the core visuals and video clips from the Summer 2026 marketing campaign. Includes fast cuts and upbeat transitions suitable for social media promotion.',
        dateCreated: 'May 12, 2026',
        duration: '0:34',
        metadata: ['summer', 'campaign', 'highlights', 'video']
      },
      {
        id: '2',
        title: 'Deptify',
        type: 'Images',
        content: 'Brand',
        thumbnailUrl: 'https://www.dept.global/wp-content/uploads/2026/06/Deptify-1080x1350-1.png',
        mediaUrl: 'https://www.dept.global/wp-content/uploads/2026/06/Deptify-1080x1350-1.png',
        description: 'Comprehensive brand guidelines detailing typography, color palettes, and logo usage rules for the Acme Corp rebranding project finalized in Q1.',
        dateCreated: 'Mar 04, 2026',
        metadata: ['acme', 'rebrand', 'typography', 'colors']
      },
      {
        id: '3',
        title: 'Core Values & Mission Animation',
        type: 'Gifs',
        content: 'Culture',
        thumbnailUrl: 'https://images.unsplash.com/photo-1557672172-298e090bd0f1?auto=format&fit=crop&q=80&w=600',
        mediaUrl: 'https://media.giphy.com/media/3o7aD2saalEvTehEX2/giphy.gif',
        description: 'A short, engaging animated loop used for internal communications showcasing our 3 core company values: Integrity, Innovation, and Impact.',
        dateCreated: 'Jan 15, 2026',
        duration: '0:04',
        metadata: ['internal', 'culture', 'values', 'animated']
      },
      {
        id: '4',
        title: 'Primary Brand Master Logo',
        type: 'Logos',
        content: 'Brand',
        thumbnailUrl: 'https://images.unsplash.com/photo-1627389955611-70c92a5d2e2b?auto=format&fit=crop&q=80&w=600',
        mediaUrl: 'https://images.unsplash.com/photo-1627389955611-70c92a5d2e2b?auto=format&fit=crop&q=100&w=1200',
        description: 'The official master version of the primary brand logo. Provided here as a high-resolution transparent vector-like placeholder for all official outward-facing collateral.',
        dateCreated: 'Dec 10, 2025',
        metadata: ['master', 'primary', 'vector', 'transparent']
      },
      {
        id: '5',
        title: 'Global Tech Summit 2025 Keynote',
        type: 'Video',
        content: 'Events',
        thumbnailUrl: 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80&w=600',
        mediaUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
        description: 'Full recording of the CEO\'s keynote speech during the Global Tech Summit 2025 in Berlin. Features the product roadmap announcement and live demo.',
        dateCreated: 'Oct 22, 2025',
        duration: '45:12',
        metadata: ['tech', 'summit', 'conference', 'keynote']
      },
      {
        id: '6',
        title: 'Social Media Reaction Packs',
        type: 'Gifs',
        content: 'Brand',
        thumbnailUrl: 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&q=80&w=600',
        mediaUrl: 'https://media.giphy.com/media/l41lFw057lAJQMwg0/giphy.gif',
        description: 'A collection of branded reaction GIFs designed specifically for our social media community management team to use on X (Twitter) and LinkedIn.',
        dateCreated: 'Aug 05, 2025',
        duration: '0:03',
        metadata: ['social', 'reactions', 'marketing', 'fun']
      },
      {
        id: '7',
        title: 'Annual Global Team Retreat',
        type: 'Images',
        content: 'Culture',
        thumbnailUrl: 'https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&q=80&w=600',
        mediaUrl: 'https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&q=100&w=1200',
        description: 'High-quality photography collection from the 2025 Annual Global Team Retreat held in Lisbon, Portugal. Approved for recruitment marketing usage.',
        dateCreated: 'Jul 18, 2025',
        metadata: ['team', 'retreat', 'global', 'fun', 'bonding']
      },
      {
        id: '8',
        title: 'TechCorp SaaS Platform Demo',
        type: 'Video',
        content: 'Client Case',
        thumbnailUrl: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=600',
        mediaUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
        description: 'A polished screen-recording and voiceover walkthrough of the new TechCorp SaaS platform dashboard, used for onboarding new enterprise clients.',
        dateCreated: 'Jun 30, 2025',
        duration: '3:45',
        metadata: ['saas', 'software', 'techcorp', 'demo', 'ui']
      },
      {
        id: '9',
        title: 'Monochrome Logo Variant',
        type: 'Logos',
        content: 'Brand',
        thumbnailUrl: 'https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?auto=format&fit=crop&q=80&w=600',
        mediaUrl: 'https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?auto=format&fit=crop&q=100&w=1200',
        description: 'Standard monochrome (black and white) variant of the primary logo. Intended for use on complex backgrounds, sponsor arrays, and print materials.',
        dateCreated: 'Dec 10, 2025',
        metadata: ['logo', 'monochrome', 'black and white']
      },
      {
        id: '10',
        title: 'Product Launch Event BTS',
        type: 'Images',
        content: 'Events',
        thumbnailUrl: 'https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&q=80&w=600',
        mediaUrl: 'https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&q=100&w=1200',
        description: 'Behind-the-scenes candids from the flagship product launch event in New York. Features the executive team prepping backstage and crowd reactions.',
        dateCreated: 'Nov 02, 2025',
        metadata: ['launch', 'bts', 'behind the scenes', 'photography']
      }
    ];

    // --- State ---
    let state = {
      searchQuery: '',
      selectedType: '',
      selectedContent: ''
    };

    // --- DOM Elements ---
    const searchInput = document.getElementById('searchInput');
    const typeSelect = document.getElementById('typeSelect');
    const contentSelect = document.getElementById('contentSelect');
    
    const assetGrid = document.getElementById('assetGrid');
    const emptyState = document.getElementById('emptyState');
    const assetCount = document.getElementById('assetCount');
    const assetWord = document.getElementById('assetWord');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    
    // Modal Elements
    const previewModal = document.getElementById('previewModal');
    const modalMediaContainer = document.getElementById('modalMediaContainer');
    const modalType = document.getElementById('modalType');
    const modalContent = document.getElementById('modalContent');
    const modalTitle = document.getElementById('modalTitle');
    const modalDate = document.getElementById('modalDate');
    const modalDurationContainer = document.getElementById('modalDurationContainer');
    const modalDuration = document.getElementById('modalDuration');
    const modalDescription = document.getElementById('modalDescription');

    // --- STREAMING_CHUNK:Filtering and rendering logic ---
    function getFilteredAssets() {
      const query = state.searchQuery.toLowerCase().trim();
      
      return mockAssets.filter(asset => {
        const matchesSearch = query === '' || 
                              asset.title.toLowerCase().includes(query) || 
                              asset.metadata.some(tag => tag.toLowerCase().includes(query));
        const matchesType = state.selectedType === '' || asset.type === state.selectedType;
        const matchesContent = state.selectedContent === '' || asset.content === state.selectedContent;

        return matchesSearch && matchesType && matchesContent;
      });
    }

    function renderAssets() {
      const filtered = getFilteredAssets();
      
      // Update counts and clear button visibility
      assetCount.textContent = filtered.length;
      assetWord.textContent = filtered.length === 1 ? 'asset' : 'assets';
      
      if (state.searchQuery || state.selectedType || state.selectedContent) {
        clearFiltersBtn.classList.remove('hidden');
      } else {
        clearFiltersBtn.classList.add('hidden');
      }

      // Toggle Empty State vs Grid
      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        assetGrid.classList.add('hidden');
      } else {
        emptyState.classList.add('hidden');
        assetGrid.classList.remove('hidden');
        
        // Build Grid HTML
        assetGrid.innerHTML = filtered.map(asset => `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-indigo-200 transition-all duration-300 flex flex-col overflow-hidden group">
            
            <div class="relative h-52 w-full overflow-hidden bg-slate-100 cursor-pointer" onclick="openPreview('${asset.id}')">
              <img src="${asset.thumbnailUrl}" alt="${asset.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" loading="lazy" />
              
              <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                 <span class="text-white text-sm font-medium flex items-center gap-1.5">
                   <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                   </svg>
                   View Asset
                 </span>
              </div>
            </div>

            <div class="p-5 flex-1 flex flex-col">
              <div class="flex justify-between items-start mb-2">
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-800">
                  ${asset.type}
                </span>
                <span class="text-xs text-slate-500 font-medium">
                  ${asset.content}
                </span>
              </div>
              
              <h3 class="text-lg font-bold text-slate-900 leading-tight mb-2 group-hover:text-indigo-600 transition-colors line-clamp-2">
                ${asset.title}
              </h3>
              
            </div>
          </div>
        `).join('');
      }
    }

    // --- STREAMING_CHUNK:Event Listeners & Actions ---
    function updateStateAndRender() {
      state.searchQuery = searchInput.value;
      state.selectedType = typeSelect.value;
      state.selectedContent = contentSelect.value;
      renderAssets();
    }

    searchInput.addEventListener('input', updateStateAndRender);
    typeSelect.addEventListener('change', updateStateAndRender);
    contentSelect.addEventListener('change', updateStateAndRender);
    
    // Make global for inline onclick handlers
    window.clearAllFilters = function() {
      searchInput.value = '';
      typeSelect.value = '';
      contentSelect.value = '';
      updateStateAndRender();
    };
    
    clearFiltersBtn.addEventListener('click', window.clearAllFilters);

    window.openPreview = function(assetId) {
      const asset = mockAssets.find(a => a.id === assetId);
      if (!asset) return;

      // Populate Modal Info
      modalType.textContent = asset.type;
      modalContent.textContent = asset.content;
      modalTitle.textContent = asset.title;
      modalDate.textContent = asset.dateCreated;
      modalDescription.textContent = asset.description;
      
      if (asset.duration) {
        modalDuration.textContent = asset.duration;
        modalDurationContainer.classList.remove('hidden');
      } else {
        modalDurationContainer.classList.add('hidden');
      }

      // Populate Modal Media
      if (asset.type === 'Video') {
        modalMediaContainer.innerHTML = `
          <video controls autoplay class="w-full h-full object-contain">
            <source src="${asset.mediaUrl}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        `;
      } else {
        modalMediaContainer.innerHTML = `
          <img src="${asset.mediaUrl}" alt="${asset.title}" class="w-full h-full object-contain" />
        `;
      }

      // Show Modal & Prevent Body Scroll
      previewModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    };

    window.closePreview = function() {
      previewModal.classList.add('hidden');
      document.body.style.overflow = '';
      // Stop video playback by clearing the container
      modalMediaContainer.innerHTML = ''; 
    };

    // Initialize UI on load
    document.addEventListener('DOMContentLoaded', renderAssets);

  </script>
</body>
</html>
